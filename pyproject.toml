[project]
name = "nexus-bot"
version = "0.1.0"
description = "Hybrid AI assistant backend combining RAG and controlled tools"
authors = [
    { name = "tom2811" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
