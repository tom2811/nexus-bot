[project]
name = "nexus-bot"
version = "0.1.0"
description = "Hybrid AI assistant backend combining RAG and controlled tools"
authors = [
    { name = "tom2811" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.6.0",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "psycopg2-binary>=2.9.10",
    "pypdf>=6.19.0",
    "sentence-transformers>=5.1.2",
    "slowapi>=0.1.10",
    "torch>=2.2.0",
    "transformers>=4.57.0",
    "uvicorn>=0.39.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=0.0.1",
    "pytest>=8.4.2",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
]
